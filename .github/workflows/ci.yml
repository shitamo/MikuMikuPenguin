name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkgconf python3 \
            libgl-dev libglfw3-dev libepoxy-dev libglm-dev libbullet-dev libstb-dev \
            libimgui-dev libfontconfig-dev libsdl2-mixer-dev \
            xvfb xauth libgl1-mesa-dri

      - name: Build
        run: |
          meson setup build
          meson compile -C build

      - name: Unit tests
        run: meson test -C build --suite unit --print-errorlogs

      - name: Rendering test (Xvfb, Mesa software rendering)
        env:
          MMP_RENDER_TEST_REQUIRED: 1
        run: meson test -C build --suite render --print-errorlogs --verbose

      - name: Upload rendered images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-images
          path: build/test/render/
          if-no-files-found: ignore

  debian-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential devscripts dpkg-dev equivs
          sudo DEBIAN_FRONTEND=noninteractive mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' debian/control

      - name: dpkg-buildpackage
        run: dpkg-buildpackage -us -uc -b

      - name: Check the packages
        run: |
          ls -l ../*.deb
          dpkg-deb --contents ../mikumikupenguin_*.deb | grep -E 'usr/bin/pmx$'
          dpkg-deb --contents ../libmmp-dev_*.deb | grep -E 'libmmp\.a$'
          mkdir -p packages && cp ../*.deb packages/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: packages/
